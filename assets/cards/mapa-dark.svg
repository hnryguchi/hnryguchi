<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.bar{transform-origin:left;animation:g 1.2s ease-out both}@keyframes g{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect x=".5" y=".5" width="399" height="149" rx="10" fill="#0d1117" stroke="#30363d"/><rect class="bar" x="1" y="1" width="398" height="4" rx="2" fill="#0969da"/><text x="18" y="39" font-size="16" font-weight="600" fill="#e6edf3">Mapa de operações marítimas</text><rect x="321" y="22" width="63" height="22" rx="11" fill="#0969da" fill-opacity=".15"/><text x="352" y="37" font-size="11" text-anchor="middle" fill="#0969da" font-weight="600">produção</text><text x="18" y="70" font-size="12.5" fill="#9198a1">Ingestão por e-mail (Logic Apps), validação por regras,</text><text x="18" y="88" font-size="12.5" fill="#9198a1">revisão por LLM e mapa WebGL2 sem redeploy.</text><rect x="18" y="112" width="67" height="22" rx="6" fill="#161b22" stroke="#30363d"/><text x="51" y="127" font-size="11" text-anchor="middle" fill="#c9d1d9">MapLibre</text><rect x="90.8" y="112" width="54" height="22" rx="6" fill="#161b22" stroke="#30363d"/><text x="118" y="127" font-size="11" text-anchor="middle" fill="#c9d1d9">WebGL2</text><rect x="150.39999999999998" y="112" width="80" height="22" rx="6" fill="#161b22" stroke="#30363d"/><text x="190" y="127" font-size="11" text-anchor="middle" fill="#c9d1d9">Logic Apps</text><rect x="236.39999999999998" y="112" width="80" height="22" rx="6" fill="#161b22" stroke="#30363d"/><text x="276" y="127" font-size="11" text-anchor="middle" fill="#c9d1d9">Claude API</text></svg>