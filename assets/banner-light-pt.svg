<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Henry Noguchi</title>
  <desc id="d">Engenharia de software e IA para dados ambientais.</desc>
  <style>
    .w1{animation:drift 9s ease-in-out infinite alternate}
    .w2{animation:drift 12s ease-in-out infinite alternate-reverse}
    .w3{animation:drift 15s ease-in-out infinite alternate}
    .ts{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.4s ease-out .3s forwards}
    .flag{opacity:0;transform-origin:970px 64px;animation:show .4s ease-out 1.6s forwards,pulse 2.2s ease-in-out 2s infinite}
    .lbl{opacity:0;animation:show .5s ease-out 1.9s forwards}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes drift{from{transform:translateX(12px)}to{transform:translateX(-12px)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes show{to{opacity:1}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .w1,.w2,.w3,.cur{animation:none}
      .ts{animation:none;stroke-dashoffset:0}
      .flag,.lbl{animation:none;opacity:1}
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="0.55" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#0d9488" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0369a1" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="14" fill="url(#bg)"/>
  <rect x="700" width="580" height="300" fill="url(#dots)"/>
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path class="w1" d="M560 210 C 660 170, 740 250, 840 210 S 1020 170, 1120 210 S 1240 240, 1290 220" stroke-width="3"/>
    <path class="w2" d="M600 238 C 700 205, 780 275, 880 238 S 1060 205, 1160 238 S 1250 260, 1290 250" stroke-width="2" stroke-opacity="0.6"/>
    <path class="w3" d="M640 264 C 740 238, 820 292, 920 264 S 1100 238, 1200 264" stroke-width="1.5" stroke-opacity="0.35"/>
  </g>
  <polyline class="ts" fill="none" stroke="#d97706" stroke-width="2"
    points="760,118 790,112 820,116 850,104 880,108 910,98 940,102 970,64 1000,100 1030,94 1060,90 1090,96 1120,84 1150,88 1180,80"/>
  <circle class="flag" cx="970" cy="64" r="7" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text class="lbl" x="984" y="58" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#b91c1c">SUSPEITO · pico</text>
  <text x="64" y="118" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#0c1a2e">Henry Noguchi</text>
  <text x="66" y="162" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#075985">Engenharia de software e IA para dados ambientais</text>
  <text x="66" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#0369a1">pipelines de dados oceânicos e atmosféricos · geoespacial · agentes LLM</text>
  <text x="66" y="250" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#0f766e">$ stack: Python · TypeScript · Azure · Claude API · GitHub Actions<tspan class="cur"> ▍</tspan></text>
</svg>
